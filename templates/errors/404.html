{% extends "errors/base_error.html" %}

{% block title %}Not Found{% endblock %}

{% block error_content %}
    <div class="error-icon">🔍</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
    
    <div class="error-actions">
        <a href="{{ url_for('health.index') }}" class="btn btn-primary">Go to Home</a>
        <a href="{{ url_for('health.sitemap') }}" class="btn btn-secondary">View Site Map</a>
    </div>

    <div class="footer-text">
        Need help finding something? <a href="{{ url_for('health.sitemap') }}" class="home-link">Check our site map</a>.
    </div>
{% endblock %}
