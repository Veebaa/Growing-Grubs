{% extends "errors/base_error.html" %}

{% block title %}Forbidden{% endblock %}

{% block error_content %}
    <div class="error-icon">🚫</div>
    <div class="error-code">403</div>
    <h1 class="error-title">Forbidden</h1>
    <p class="error-message">You don't have permission to access this resource.</p>
    
    <div class="error-actions">
        <a href="{{ url_for('health.index') }}" class="btn btn-primary">Go to Home</a>
        <button onclick="history.back()" class="btn btn-secondary">Go Back</button>
    </div>

    <div class="footer-text">
        If you believe you should have access, please <a href="mailto:support@growinggrubs.com" class="home-link">contact support</a>.
    </div>
{% endblock %}
